name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency audit findings
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            const findings = Object.entries(report.vulnerabilities ?? {});
            console.log("Dependency audit:", report.metadata?.vulnerabilities ?? {});
            for (const [name, item] of findings) {
              console.log(`${name}: ${item.severity}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}`);
              for (const advisory of item.via ?? []) {
                if (typeof advisory === "object") console.log(`  - ${advisory.title} (${advisory.url})`);
              }
            }
          '
      - name: Check, build, lint and test
        run: |
          npm run build
          npm run lint
          npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build production site
        run: npm run build
      - name: Run browser smoke tests
        run: npx playwright test
